name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      skip_e2e:
        description: Skip browser tests after they pass locally on the same commit
        type: boolean
        required: false
        default: false
      network_seeds:
        description: Full-game seeds per scenario (1–1000; default 20)
        type: number
        required: true
        default: 20
      network_start_index:
        description: First deterministic game index for a manual run
        type: number
        required: true
        default: 0
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:coverage
      - run: pnpm exec playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_e2e
      - run: pnpm test:e2e
        if: github.event_name != 'workflow_dispatch' || !inputs.skip_e2e
        env:
          CI_BROWSER_SET: ${{ github.event_name == 'pull_request' && 'chromium' || 'all' }}
      - name: Build GitHub Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: pnpm --filter @cp2p/web build
        env:
          GITHUB_PAGES: 'true'
      - name: Upload GitHub Pages site
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          if-no-files-found: ignore

  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b tools/sim
      - name: Verified games
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node tools/sim/dist/index.js run --games 100000 --players 4 --seed 42 --parallel 4 > simulation-games.json
          else
            node tools/sim/dist/index.js run --games 2000 --players 4 --seed 42 --parallel 4 > simulation-games.json
          fi
      - name: Fuzz inputs
        if: github.event_name != 'schedule'
        run: node tools/sim/dist/index.js fuzz --iterations 50000 --seed 42 > simulation-fuzz.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation
          path: |
            simulation-games.json
            simulation-fuzz.json
            failures/
          if-no-files-found: ignore

  network-plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate network matrix planner
        run: node --test .github/scripts/network-matrix.test.mjs
      - name: Plan deterministic scenario shards
        id: plan
        run: node .github/scripts/network-matrix.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          NETWORK_SEEDS: ${{ inputs.network_seeds }}
          NETWORK_START_INDEX: ${{ inputs.network_start_index }}

  network-simulation:
    needs: [network-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.network-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b tools/sim
      - name: Full P2P game simulation
        run: >-
          node tools/sim/dist/index.js net
          --scenario ${{ matrix.scenario }}
          --seeds ${{ matrix.seeds }}
          --seed 42
          --parallel 1
          --start-index ${{ matrix.startIndex }}
          > network-scenario-${{ matrix.scenario }}-start-${{ matrix.startIndex }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-scenario-${{ matrix.scenario }}-start-${{ matrix.startIndex }}
          path: network-scenario-${{ matrix.scenario }}-start-${{ matrix.startIndex }}.json
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [check, simulation, network-simulation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
