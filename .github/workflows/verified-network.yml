name: Verified network acceptance

on:
  workflow_call:
    inputs:
      scenario:
        type: string
        required: false
        default: all
      lifecycle:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      scenario:
        description: Run every fault case or repeat one selected scenario
        type: choice
        required: true
        default: all
        options:
          - all
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
          - '9'
          - '2,5,6'
      lifecycle:
        description: Run the four-human persistence profile instead of fault scenarios
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: verified-network-${{ github.ref }}-${{ inputs.lifecycle && 'persistence' || 'faults' }}
  cancel-in-progress: false

jobs:
  full-game:
    name: ${{ inputs.lifecycle && 'Persistence lifecycle' || format('Real crypto scenario {0}', matrix.scenario) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.lifecycle && '[1]' || (inputs.scenario == 'all' && '[1,2,3,4,5,6,7,8,9]' || format('[{0}]', inputs.scenario))) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b tools/sim
      - name: Record source revision
        run: git rev-parse HEAD > verified-source-revision.txt
      - name: Run one complete game with independent peer audits
        if: '!inputs.lifecycle'
        run: >-
          node tools/sim/dist/index.js net
          --security verified
          --scenario ${{ matrix.scenario }}
          --seeds 1
          --seed 42
          --start-index 0
          --parallel 1
          --max-elapsed-ms 900000
          > verified-network-${{ matrix.scenario }}.json
      - name: Run one complete persistence game with private-state comparisons
        if: inputs.lifecycle
        run: >-
          node tools/sim/dist/index.js net
          --security verified
          --scenario 1
          --lifecycle persistence
          --seeds 1
          --seed 42
          --start-index 0
          --parallel 1
          --max-elapsed-ms 900000
          > verified-persistence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.lifecycle && 'verified-persistence' || format('verified-network-{0}', matrix.scenario) }}
          path: |
            verified-network-${{ matrix.scenario }}.json
            verified-persistence.json
            verified-source-revision.txt
          if-no-files-found: warn
          retention-days: 14
